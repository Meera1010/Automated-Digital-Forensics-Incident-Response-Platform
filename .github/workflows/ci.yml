# =============================================================================
# ADFIR Platform — CI/CD Pipeline
# =============================================================================
# Runs on every push and pull request to the main branch.
# Jobs:
#   1. lint    — flake8 style checks
#   2. test    — pytest unit & integration tests
#   3. docker  — Docker image build verification
# =============================================================================

name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Linting with flake8
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run flake8
        run: |
          flake8 backend/ --max-line-length=100 --statistics --count

  # ---------------------------------------------------------------------------
  # Job 2: Tests with pytest
  # ---------------------------------------------------------------------------
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          FLASK_ENV: testing
          SECRET_KEY: ci-test-secret-key-not-for-production
          JWT_SECRET_KEY: ci-test-jwt-secret-not-for-production
          AES_MASTER_KEY: deadbeef00000000000000000000000000000000000000000000000000000000
        run: |
          pytest tests/ -v --tb=short

  # ---------------------------------------------------------------------------
  # Job 3: Docker build verification
  # ---------------------------------------------------------------------------
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t adfir-platform:ci-${{ github.sha }} .
